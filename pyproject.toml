[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telecopilot"
version = "1.0.0"
description = "Agent-assist copilot for telecom customer service representatives (Arabic + English)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "qdrant-client>=1.8.0",
    "cohere>=5.0.0",
    "google-genai>=0.1.1",
    "google-generativeai>=0.4.0",
    "langchain>=0.1.10",
    "langchain-text-splitters>=0.0.1",
    "langfuse>=2.20.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.1.0",
    "python-docx>=1.1.0",
    "pymupdf>=1.23.0",
    "pillow>=10.2.0",
    "loguru>=0.7.2",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
